    <title>Eventos</title>
    <link id="menuCss" rel="stylesheet" href="css/menu.css?v=20260418" />
    <script>
        (function () {
            function resolverBaseEventos() {
                var caminho = String(window.location.pathname || "");
                var caminhoLower = caminho.toLowerCase();
                var marcador = "/eventoshtml/";
                var indice = caminhoLower.indexOf(marcador);
                if (indice === -1) {
                    return null;
                }
                return caminho.slice(0, indice + marcador.length);
            }

            var css = document.getElementById("menuCss");
            if (css) {
                css.addEventListener("error", function () {
                    var base = resolverBaseEventos();
                    if (!base) {
                        return;
                    }
                    css.href = base + "css/menu.css?v=20260418";
                });
            }
        })();
    </script>
</head>

<body>

                </ul>
                <script src="js/extrato-periodo-config.js?v=20260507"></script>
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        var btn = document.getElementById('gerarExtratoBtn');
                        if (btn) {
                            btn.addEventListener('click', function (e) {
                                e.preventDefault();
                                var periodo = typeof window.eventosObterPeriodoPadraoExtrato === 'function'
                                    ? window.eventosObterPeriodoPadraoExtrato(new Date())
                                    : (function () {
                                        var hoje = new Date();
                                        return {
                                            inicio: new Date(hoje.getFullYear(), hoje.getMonth(), 1),
                                            fim: new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0)
                                        };
                                    })();
                                function formatarData(dt) {
                                    var m = String(dt.getMonth() + 1).padStart(2, '0');
                                    var d = String(dt.getDate()).padStart(2, '0');
                                    return dt.getFullYear() + '-' + m + '-' + d;
                                }
                                var dataI = formatarData(periodo.inicio);
                                var dataF = formatarData(periodo.fim);
                                var url = 'PHP/Extrato.php?DataI=' + encodeURIComponent(dataI) + '&DataF=' + encodeURIComponent(dataF);
                                window.location.href = url;
                            });
                        }
                    });
                </script>

    <script src="js/menu.js?v=20260422"></script>
    <script>
        (function () {
            if (typeof window.inicializarPeriodo === "function") {
                return;
            }

            var caminho = String(window.location.pathname || "");
            var caminhoLower = caminho.toLowerCase();
            var marcador = "/eventoshtml/";
            var indice = caminhoLower.indexOf(marcador);
            if (indice === -1) {
                return;
            }

            var script = document.createElement("script");
            script.src = caminho.slice(0, indice + marcador.length) + "js/menu.js?v=20260422";
            document.body.appendChild(script);
        })();
    </script>
