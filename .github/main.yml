- name: Checkout code
  uses: actions/checkout@v4

- name: Deploy via FTP
  uses: SamKirkland/FTP-Deploy-Action@v4.3.4
  with:
    server: winxxxx.site4now.net
    username: ${{ secrets.FTP_USERNAME }}
    password: ${{ secrets.FTP_PASSWORD }}
    remote-folder: /eventosHTML
    local-dir: ./eventos
