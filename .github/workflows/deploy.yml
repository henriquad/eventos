- name: Checkout code
  uses: actions/checkout@v4

- name: Deploy via FTP
  uses: SamKirkland/FTP-Deploy-Action@v4.3.4
  with:
    server: winxxxx.site4now.net
    username: ${{ secrets.FTP_USERNAME }}
    password: ${{ secrets.FTP_PASSWORD }}
    remote-folder: /eventosHTML
    local-dir: ./

    name: Deploy Automático

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instala dependências
      - name: Install Dependencies
        run: npm install

      # 4. Executa testes
      - name: Run Tests
        run: npm test

      # 5. Compila o projeto
      - name: Build Project
        run: npm run build

      # 6. Envia arquivos para o servidor via SSH
      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "./dist/*, ./package*.json"
          target: "/var/www/minha-aplicacao"

      # 7. Reinicia o serviço no servidor
      - name: Post-deploy Scripts
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/minha-aplicacao
            npm install --production
            pm2 restart all || pm2 start dist/index.js --name "app"   